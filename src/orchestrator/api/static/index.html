<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Incident Orchestrator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e6b73'/%3E%3Ccircle cx='9' cy='16' r='3' fill='white'/%3E%3Ccircle cx='23' cy='9' r='3' fill='white'/%3E%3Ccircle cx='23' cy='23' r='3' fill='white'/%3E%3Cpath d='M12 16h3c3 0 3-7 5-7M15 16c3 0 3 7 5 7' fill='none' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --sunk:#eceef2; --line:#dcdfe5; --line-strong:#c6cbd3;
  --tx:#161e28; --mut:#566271; --faint:#6f7a89;
  --brand:#0e6b73; --brand-hi:#0a5860; --brand-tint:#e2f1f2; --on-brand:#fff;
  --ok:#1d7a45; --ok-tint:#e3f3ea; --warn:#8f5a00; --warn-tint:#fbefd7; --bad:#b3261e; --bad-tint:#fbe5e3; --hold:#5f43b8; --hold-tint:#ece8f9;
  --shadow:0 1px 2px rgba(22,30,40,.06),0 8px 24px -12px rgba(22,30,40,.18);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"Iowan Old Style","New York","Charter","Source Serif Pro",Georgia,serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#0d1216; --surface:#141b21; --sunk:#0a0e11; --line:#25303a; --line-strong:#34414d;
  --tx:#e6ebf0; --mut:#9aa7b4; --faint:#7d8a97;
  --brand:#5cc8d0; --brand-hi:#7fd6dc; --brand-tint:#12282b; --on-brand:#06242a;
  --ok:#5fcb8d; --ok-tint:#12261c; --warn:#e3a33b; --warn-tint:#2a2110; --bad:#f07a72; --bad-tint:#2e1614; --hold:#aa98f2; --hold-tint:#1e1a33;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 28px -14px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 var(--sans);font-variant-numeric:tabular-nums;min-height:100vh}
::selection{background:var(--brand);color:var(--on-brand)}
input,textarea,select{caret-color:var(--brand)}
*{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-60px;background:var(--brand);color:var(--on-brand);padding:8px 14px;border-radius:8px;z-index:20;text-decoration:none;font-weight:600}
.skip:focus{top:8px}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:14px;height:14px}
code,.mono{font-family:var(--mono);font-size:12.5px}

/* shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px;padding:18px 14px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;font-weight:650;font-size:15px;letter-spacing:-.01em;line-height:1.2}
.mark{width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none}
.brand small{display:block;font-weight:400;color:var(--mut);font-size:12px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--mut);text-decoration:none;transition:background .15s,color .15s}
.nav a:hover{background:var(--sunk);color:var(--tx)}
.nav a[aria-current=page]{background:var(--brand-tint);color:var(--brand);font-weight:600}
.nav .count{margin-left:auto;background:var(--hold);color:#fff;border-radius:999px;padding:0 7px;font-size:11px;font-weight:600;line-height:18px;min-width:18px;text-align:center}
:root[data-theme=dark] .nav .count{color:#0d1216}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.who{display:flex;flex-direction:column;gap:4px}
.who label{font-size:12px;color:var(--mut)}
.conn{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mut)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.conn.on .dot{background:var(--ok);animation:pulse 2s infinite}
.conn.err .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.tools{display:flex;gap:6px}
.tools button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;color:var(--mut);font-size:12.5px}
.tools button:hover{color:var(--tx);border-color:var(--line-strong)}

main{padding:26px clamp(16px,2.6vw,40px) 64px;min-width:0}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font:600 clamp(22px,2.4vw,30px)/1.18 var(--serif);letter-spacing:-.01em;margin:0;text-wrap:balance}
h2{font-size:13px;font-weight:650;margin:0}
h3{font-size:13px;margin:0}
.sub{color:var(--mut);margin:6px 0 0;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);min-height:46px}
.pad{padding:16px}
.mut{color:var(--mut)}.faint{color:var(--faint)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 15px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{border-color:var(--tx)}
.btn:active{transform:translateY(1px)}
.btn{text-decoration:none}
.btn.sm{min-height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-hi);border-color:var(--brand-hi)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger:hover{background:var(--bad-tint);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default;pointer-events:none}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:600;font-size:13px}
.field small,.hint{color:var(--mut);font-size:12.5px}
input[type=text],input[type=password],input[type=number],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);color:var(--tx);font:inherit}
select{appearance:auto}
textarea{min-height:76px;resize:vertical;line-height:1.5}
textarea.code,input.code{font:12.5px/1.5 var(--mono)}
input::placeholder,textarea::placeholder{color:var(--faint)}
[aria-invalid=true]{border-color:var(--bad)!important}
.err{color:var(--bad);font-size:13px}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--brand);width:16px;height:16px;flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip-btn{padding:5px 11px;border:1px solid var(--line-strong);border-radius:999px;background:none;cursor:pointer;color:var(--mut);font-size:12.5px}
.chip-btn:hover{color:var(--tx);border-color:var(--tx)}
.chip-btn[aria-pressed=true]{background:var(--brand-tint);color:var(--brand);border-color:var(--brand);font-weight:600}

/* status chips */
.st{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--mut)}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.running{background:var(--brand-tint);color:var(--brand)}
.st.completed,.st.succeeded,.st.approved,.st.executed{background:var(--ok-tint);color:var(--ok)}
.st.degraded,.st.paused,.st.held,.st.edited{background:var(--warn-tint);color:var(--warn)}
.st.failed,.st.budget_exceeded,.st.rejected,.st.cancelled{background:var(--bad-tint);color:var(--bad)}
.st.awaiting_approval,.st.pending_decision{background:var(--hold-tint);color:var(--hold)}
.sev{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;border:1px solid currentColor}
.sev.sev1{color:var(--bad)}.sev.sev2{color:var(--warn)}.sev.sev3{color:var(--mut)}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 8px;border-radius:6px;background:var(--sunk);color:var(--mut);font-size:12px;border:1px solid var(--line)}
.tag.taint{background:var(--warn-tint);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line));font-weight:600}
.risk{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12.5px;padding:2px 9px;border-radius:6px}
.risk.high{background:var(--bad-tint);color:var(--bad)}.risk.medium{background:var(--warn-tint);color:var(--warn)}.risk.low{background:var(--ok-tint);color:var(--ok)}

/* run header */
.run-head{margin-bottom:18px;display:flex;flex-direction:column;gap:14px}
.run-title{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.run-title h1{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ids{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--mut);font-size:12.5px;margin-top:8px;align-items:center}
.ctrls{display:flex;gap:8px;flex-wrap:wrap}
.budget{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px 22px;padding:12px 16px}
.meter b{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600}
.meter b span{font-weight:400;color:var(--mut)}
.meter .bar{margin-top:6px}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand);border-radius:3px;transition:width .4s var(--ease)}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.banner{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-radius:10px;font-size:13.5px}
.banner svg{margin-top:2px}
.banner.ok{background:var(--ok-tint);color:var(--ok)}
.banner.bad{background:var(--bad-tint);color:var(--bad)}
.banner.warn{background:var(--warn-tint);color:var(--warn)}
.banner b{font-weight:650}
.banner .sub2{color:inherit;opacity:.9;display:block;font-weight:400}

/* console layout */
.console{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
.col-main{display:flex;flex-direction:column;gap:18px;min-width:0}
.rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;padding:2px;margin:-2px;min-width:0}

/* decision panel */
.decide{border-color:var(--hold);box-shadow:0 0 0 3px color-mix(in srgb,var(--hold) 14%,transparent),var(--shadow)}
.decide .panel-h{background:var(--hold-tint);border-radius:11px 11px 0 0;color:var(--hold)}
.decide .panel-h h2{font:600 16px var(--serif);color:var(--hold)}
.decide.idle{border-color:var(--line);box-shadow:var(--shadow)}
.decide.idle .panel-h{background:none;color:var(--tx)}
.decide.idle .panel-h h2{color:var(--tx)}
.dec{padding:16px;display:flex;flex-direction:column;gap:12px;border-bottom:1px solid var(--line)}
.dec:last-child{border-bottom:0}
.act{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px}
.act code{font-size:15px;font-weight:700;color:var(--tx)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:13px}
.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-word;font-family:var(--mono);font-size:12.5px}
.why{margin:0;padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:13.5px}
.reasons{margin:0;padding:0 0 0 18px;color:var(--mut);font-size:13px}
.reasons li{margin:2px 0}
.dec-btns{display:flex;gap:8px;flex-wrap:wrap}
.done-list summary{cursor:pointer;padding:11px 16px;color:var(--mut);font-size:13px}
.done-item{padding:10px 16px;border-top:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px}

/* untrusted */
.untrusted{border:1px dashed var(--warn);background:var(--warn-tint);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.untrusted .u-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--warn)}
.untrusted .u-t{font:12.5px/1.5 var(--mono);color:var(--tx);white-space:pre-wrap;word-break:break-word;margin:0}
.untrusted .u-f{font-size:12px;color:var(--mut)}
.logline.q{background:var(--warn-tint);color:var(--warn);border-radius:4px}

/* dag */
.dag-wrap{overflow:auto;padding:12px 8px 6px}
.dag{display:block;margin:0 auto}
.edge{fill:none;stroke:var(--line-strong);stroke-width:1.5}
.edge.done{stroke:var(--ok)}
.edge.live{stroke:var(--brand);stroke-dasharray:5 4;animation:flow 1s linear infinite}
.edge.hl{stroke-width:2.5}
@keyframes flow{to{stroke-dashoffset:-18}}
.arrow{fill:var(--line-strong)}
.node{cursor:pointer;outline:none}
.node .box{fill:var(--surface);stroke:var(--line-strong);stroke-width:1.5}
.node .ic{color:var(--faint)}
.node .nm{font:600 13px var(--sans);fill:var(--tx)}
.node .ag{font:12px var(--sans);fill:var(--mut)}
.node .stl{font:600 12px var(--sans);fill:var(--faint)}
.node .badge{fill:var(--sunk)}
.node:hover .box{stroke:var(--tx)}
.node:focus-visible .box{stroke:var(--brand);stroke-width:3}
.node.sel .box{stroke:var(--brand);stroke-width:2.5;fill:var(--brand-tint)}
.node.s-pending .box{stroke-dasharray:none}
.node.s-running{color:var(--brand)}.node.s-running .box{stroke:var(--brand)}.node.s-running .stl,.node.s-running .ic{fill:var(--brand);color:var(--brand)}
.node.s-succeeded .box{stroke:var(--ok)}.node.s-succeeded .stl{fill:var(--ok)}.node.s-succeeded .ic{color:var(--ok)}
.node.s-failed .box{stroke:var(--bad)}.node.s-failed .stl{fill:var(--bad)}.node.s-failed .ic{color:var(--bad)}
.node.s-held .box{stroke:var(--warn);stroke-dasharray:5 3}.node.s-held .stl{fill:var(--warn)}.node.s-held .ic{color:var(--warn)}
.node.s-awaiting_approval .box{stroke:var(--hold);stroke-width:2.5}.node.s-awaiting_approval .stl{fill:var(--hold)}.node.s-awaiting_approval .ic{color:var(--hold)}
.node.s-skipped .box{stroke-dasharray:2 4;opacity:.8}
.node.s-running .spin{transform-origin:center;transform-box:fill-box;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.node.s-awaiting_approval .box{animation:glow 2s ease-in-out infinite}
@keyframes glow{50%{stroke-opacity:.45}}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;border:1.5px solid var(--line-strong);display:inline-block}
.legend i.running{border-color:var(--brand)}.legend i.succeeded{border-color:var(--ok)}.legend i.failed{border-color:var(--bad)}.legend i.held{border-color:var(--warn);border-style:dashed}.legend i.awaiting_approval{border-color:var(--hold);border-width:2.5px}.legend i.skipped{border-style:dotted}

/* outcome */
.outcome{padding:16px;display:grid;gap:10px}
.outcome h2{font:600 18px var(--serif)}
.outcome p{margin:0;max-width:70ch}

/* node detail */
.nd-h{display:flex;gap:12px;align-items:center}
.nd-ic{width:36px;height:36px;border-radius:9px;background:var(--sunk);display:grid;place-items:center;color:var(--brand);flex:none}
.nd-h h2{font:600 17px var(--serif)}
.sec{padding:14px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sec>h3{color:var(--mut);font-weight:650}
.sec p{margin:0}
details.blk{border:1px solid var(--line);border-radius:9px;background:var(--surface)}
details.blk>summary{cursor:pointer;padding:8px 12px;list-style:none;display:flex;align-items:center;gap:8px;font-size:13px}
details.blk>summary::-webkit-details-marker{display:none}
details.blk>summary::before{content:"";width:6px;height:6px;border-right:1.6px solid var(--mut);border-bottom:1.6px solid var(--mut);transform:rotate(-45deg);transition:transform .15s;flex:none;margin-right:2px}
details.blk[open]>summary::before{transform:rotate(45deg)}
details.blk>.body{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}
pre{margin:0;padding:10px 12px;background:var(--sunk);border-radius:8px;font:12px/1.5 var(--mono);overflow:auto;max-height:260px;white-space:pre-wrap;word-break:break-word}
.loglines{font:12px/1.55 var(--mono);max-height:220px;overflow:auto;background:var(--sunk);border-radius:8px;padding:6px 8px}
.logline{padding:1px 4px;white-space:pre-wrap;word-break:break-word}
.logline .lv{color:var(--bad);font-weight:700;margin-right:6px}
.logline .lv.WARN{color:var(--warn)}
.ev-list{margin:0;padding:0 0 0 18px;font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--mut);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--sunk)}
.tbl a{color:var(--tx);text-decoration:none;font-weight:600}
.tbl a:hover{color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.scroll{overflow:auto}
.clip{max-width:34ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tabs / timeline */
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);overflow:auto}
.tabs button{padding:9px 12px;border:0;background:none;color:var(--mut);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:600;white-space:nowrap;border-radius:6px 6px 0 0}
.tabs button:hover{color:var(--tx)}
.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--brand)}
.tab-body{max-height:480px;overflow:auto}
.tl{list-style:none;margin:0;padding:6px 0}
.tl li{display:grid;grid-template-columns:78px 22px minmax(0,1fr);gap:8px;padding:7px 16px;align-items:start}
.tl li:hover{background:var(--sunk)}
.tl time{font-size:12px;color:var(--mut);padding-top:2px}
.tl time small{display:block;color:var(--faint);font-size:11px}
.tl .ti{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--sunk);color:var(--mut)}
.tl .ti svg{width:13px;height:13px}
.tl .ti.ok{background:var(--ok-tint);color:var(--ok)}.tl .ti.bad{background:var(--bad-tint);color:var(--bad)}.tl .ti.warn{background:var(--warn-tint);color:var(--warn)}.tl .ti.hold{background:var(--hold-tint);color:var(--hold)}.tl .ti.brand{background:var(--brand-tint);color:var(--brand)}
.tl .tt{font-size:13.5px}
.tl .tt b{font-weight:650}
.tl .td{color:var(--mut);font-size:12.5px;margin-top:2px;word-break:break-word}
.tl .untrusted{margin-top:6px}
.wf{padding:8px 0}
.wf details{border-bottom:1px solid var(--line)}
.wf summary{display:grid;grid-template-columns:minmax(120px,200px) minmax(0,1fr) 70px;gap:12px;align-items:center;padding:8px 16px;cursor:pointer;list-style:none;font-size:12.5px}
.wf summary::-webkit-details-marker{display:none}
.wf summary:hover{background:var(--sunk)}
.wf .track{position:relative;height:10px;background:var(--sunk);border-radius:5px}
.wf .track i{position:absolute;top:0;bottom:0;border-radius:5px;min-width:3px;background:var(--brand)}
.wf .track i.llm{background:var(--hold)}.wf .track i.tool{background:var(--ok)}.wf .track i.task{background:var(--brand)}.wf .track i.plan{background:var(--faint)}.wf .track i.err{background:var(--bad)}
.wf .pre{padding:0 16px 12px;display:flex;flex-direction:column;gap:8px}
.kind{font-size:11px;color:var(--mut);margin-right:6px}

/* history / new */
.runs-list{display:flex;flex-direction:column}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.new-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
.scn{display:flex;flex-direction:column}
.scn label{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.scn label:last-child{border-bottom:0}
.scn label:hover{background:var(--sunk)}
.scn label:has(input:checked){background:var(--brand-tint)}
.scn input{accent-color:var(--brand);width:16px;height:16px}
.scn b{display:block}
.scn span.m{color:var(--mut);font-size:12.5px}
.form{display:flex;flex-direction:column;gap:16px;padding:16px}
.limits{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* empty / sign-in */
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:44px 20px;color:var(--mut)}
.empty h2{margin:0;color:var(--tx);font:600 20px var(--serif)}
.empty p{margin:0;max-width:52ch}
.empty .steps{text-align:left;max-width:52ch;margin:4px 0;padding-left:20px}
.empty .steps li{margin:3px 0}
.signin{min-height:100vh;display:grid;place-items:center;padding:20px}
.signin .panel{width:min(440px,100%);padding:30px;display:flex;flex-direction:column;gap:14px}
.signin h1{margin:6px 0 0;font-size:26px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:.3s var(--ease);box-shadow:var(--shadow);z-index:30;max-width:min(560px,calc(100vw - 32px))}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}
:root[data-theme=dark] .toast.bad{color:#1a0b0a}
.skel{height:14px;border-radius:6px;background:var(--sunk);animation:pulse 1.4s infinite}

@media (max-width:1180px){
  .console{display:flex;flex-direction:column;align-items:stretch}
  .rail{display:contents}
  .col-main{display:contents}
  #decide{order:1}#panel-outcome{order:2}#panel-dag{order:3}#panel-node{order:4}#panel-tabs{order:5}
  .console{gap:18px}
  .new-grid{grid-template-columns:1fr}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:10px 12px;gap:10px}
  #nav-host{order:3;width:100%;min-width:0}
  .nav{flex-direction:row;overflow:auto;width:100%}
  .nav a{white-space:nowrap}
  .side-foot{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .who,.conn span.t{display:none}
  .tools button span{display:none}
  main{padding-top:18px}
  .tl li{grid-template-columns:22px minmax(0,1fr);}
  .tl time{grid-column:2;grid-row:2;padding:0}
  .tl time small{display:inline;margin-left:6px}
  .tl .ti{grid-column:1;grid-row:1}
  .tl li>div{grid-column:2;grid-row:1}
  .wf summary{grid-template-columns:minmax(0,1fr) 56px}
  .wf .track{display:none}
  .limits{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
